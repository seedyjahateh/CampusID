# CampusID development stack.
#
# Week 0 brings up the data tier and an empty broker. Later milestones add
# profiles: `federation` (Keycloak, SimpleSAMLphp), `directory` (OpenLDAP),
# `apps` (CampusPortal, LMS/analytics simulators), `observability`.
#
#   cp .env.example .env
#   docker compose up -d --wait
#   curl http://localhost:8000/healthz

name: campusid

x-broker-env: &broker-env
  CAMPUSID_ENVIRONMENT: ${CAMPUSID_ENVIRONMENT:-dev}
  CAMPUSID_BASE_URL: ${CAMPUSID_BASE_URL:-http://localhost:8000}
  CAMPUSID_DATABASE_URL: >-
    postgresql+asyncpg://${POSTGRES_USER:-campusid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campusid}
  CAMPUSID_REDIS_URL: redis://redis:6379/0
  CAMPUSID_LOG_LEVEL: ${CAMPUSID_LOG_LEVEL:-INFO}
  CAMPUSID_LOG_FORMAT: ${CAMPUSID_LOG_FORMAT:-json}
  CAMPUSID_SAML_KEY_DIR: /var/lib/campusid/saml
  CAMPUSID_SAML_DEFAULT_IDP: ${CAMPUSID_SAML_DEFAULT_IDP:-}
  CAMPUSID_POLICY_DIR: /app/policies
  CAMPUSID_LIFECYCLE_RULES_FILE: /app/config/lifecycle_rules.yaml
  CAMPUSID_AUTHORIZATION_POLICY_FILE: /app/config/authorization.yaml
  # Empty unless the directory profile is up: a broker configured with a
  # directory it cannot reach degrades on every login, and one configured with
  # none simply has no directory.
  CAMPUSID_LDAP_URL: ${CAMPUSID_LDAP_URL:-}
  CAMPUSID_LDAP_PROFILE: ${CAMPUSID_LDAP_PROFILE:-openldap}
  CAMPUSID_LDAP_BASE_DN: ${CAMPUSID_LDAP_BASE_DN:-dc=campus,dc=test}
  CAMPUSID_LDAP_BIND_DN: ${CAMPUSID_LDAP_BIND_DN:-}
  CAMPUSID_LDAP_BIND_PASSWORD: ${CAMPUSID_LDAP_BIND_PASSWORD:-}
  # The dev directory has no certificate, so the broker is told not to try
  # StartTLS against it. Production refuses both of these settings.
  CAMPUSID_LDAP_START_TLS: ${CAMPUSID_LDAP_START_TLS:-false}
  CAMPUSID_LDAP_ALLOW_PLAINTEXT: ${CAMPUSID_LDAP_ALLOW_PLAINTEXT:-false}
  CAMPUSID_SCOPE: ${CAMPUSID_SCOPE:-campus.test}
  # Restore-critical. Rotating it replaces every SP's entire user base with
  # strangers at once, so it is backed up with the database. The broker refuses
  # to start in production while it still holds this development value.
  CAMPUSID_PAIRWISE_SALT: ${CAMPUSID_PAIRWISE_SALT:-dev-only-pairwise-salt-replace-in-production}
  TZ: UTC

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-campusid}
      # Deterministic collation so ordering is identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusid} -d ${POSTGRES_DB:-campusid}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [internal]
    # Published for local psql access only; the CI overlay removes this.
    # Off-standard default so a host that already runs Postgres still comes up.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [internal]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"

  broker:
    build:
      context: .
      target: runtime
    image: campusid/broker:dev
    environment: *broker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BROKER_PORT:-8000}:8000"
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      # The SP keypair, generated on first start. A named volume rather than a
      # tmpfs because the certificate is what peers have been told to trust:
      # losing it means re-doing the metadata exchange with every one of them.
      - saml-keys:/var/lib/campusid/saml
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # --- federation profile -------------------------------------------------
  # Behind a profile so `docker compose up` stays fast: Keycloak takes ~40s to
  # start and most work does not need it.
  #
  #   docker compose --profile federation up -d
  #   docker compose --profile federation run --rm federation-init
  keycloak:
    profiles: [federation]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Keycloak generates the URLs in its SAML descriptor from this, so it
      # must be what the *browser* can reach. The broker fetches that same
      # descriptor over the internal network and still gets browser-usable
      # URLs, which is what makes the whole arrangement work without a hosts
      # file entry. An entityID is an identifier, not a fetch address.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      TZ: UTC
    volumes:
      # Two realms, so the broker has two genuinely distinct IdPs to discover
      # between: each realm is its own SAML entity with its own entityID and
      # its own signing key.
      - ./docker/keycloak/realm-campus.json:/opt/keycloak/data/import/realm-campus.json:ro
      - ./docker/keycloak/realm-partner.json:/opt/keycloak/data/import/realm-partner.json:ro
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    networks: [internal]
    # No container healthcheck: the Keycloak image is distroless, with no curl
    # and no bash, so a shell probe never passes and `up --wait` hangs to its
    # timeout with nothing useful in the logs. federation-init polls instead.

  federation-init:
    profiles: [federation]
    image: campusid/broker:test
    build:
      context: .
      target: dev
    environment:
      <<: *broker-env
      FEDERATION_BROKER_URL: http://broker:8000
      FEDERATION_KEYCLOAK_URL: http://keycloak:8080
      FEDERATION_KEYCLOAK_REALMS: campus,partner
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    depends_on:
      broker:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    entrypoint: ["python"]
    command: ["scripts/federation_init.py"]

  # --- directory profile ---------------------------------------------------
  # An OpenLDAP with the eduPerson-shaped tree the broker reads. Behind its own
  # profile rather than the federation one: a change to the SAML gate has no
  # business waiting for a directory to start, and vice versa.
  #
  #   docker compose --profile directory up -d
  #   docker compose --profile directory run --rm directory-init
  openldap:
    profiles: [directory]
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: CampusID
      LDAP_DOMAIN: campus.test
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
      # Separate from the tree admin because it governs the schema, and the
      # seeding script loads eduPerson into cn=config with it.
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
      # No TLS in the dev stack: the image would generate a self-signed
      # certificate for a hostname nothing resolves, and the broker refuses
      # plaintext in production regardless of what this profile does.
      LDAP_TLS: "false"
    ports:
      - "${LDAP_PORT:-1389}:389"
    networks: [internal]
    healthcheck:
      # The root DSE, which is readable without binding. Probing the suffix
      # instead would need the admin password in the healthcheck command, and
      # anonymous access to the tree is denied by default — so that probe fails
      # for an authorisation reason and reads as a directory that is not up.
      test:
        ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "", "-s", "base", "namingContexts"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Seeds the tree over LDAP rather than through the image's own bootstrap.
  # The same choice federation-init makes about Keycloak, for the same reason:
  # the fixture is then created the way a real one would be, and the seeding is
  # not coupled to one image's conventions.
  directory-init:
    profiles: [directory]
    image: campusid/broker:test
    build:
      context: .
      target: dev
    environment:
      <<: *broker-env
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
    depends_on:
      openldap:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    entrypoint: ["python"]
    command: ["scripts/directory_init.py"]

  # Test runner: the dev image, which adds the test toolchain. Not started by
  # `docker compose up` — invoke it explicitly:
  #
  #   docker compose run --rm tests
  #   docker compose run --rm tests pytest tests/unit -v
  tests:
    profiles: [tools]
    build:
      context: .
      target: dev
    image: campusid/broker:test
    environment:
      <<: *broker-env
      # The directory tests bind as the admin to set up and tear down entries,
      # which is a thing only a test does — the broker itself binds as a
      # read-only service account.
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-}
    # The working tree, so a test run reflects the file just edited rather than
    # whatever was baked into the image. Only the test runner gets this: the
    # broker stays immutable and read-only, because a container serving code it
    # picked up from the host is not the thing CI built.
    volumes:
      - .:/app
    depends_on:
      broker:
        condition: service_healthy
    networks: [internal]
    entrypoint: ["pytest"]
    command: ["tests/integration", "-v"]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  saml-keys:
