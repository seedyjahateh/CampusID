# Learning analytics: the demonstration case from the README.
#
# It receives a pairwise identifier and a filtered affiliation. Nothing else -
# no name, no email, no entitlements. An analytics service needs to count
# distinct users and separate students from staff; it does not need to know who
# anybody is, and giving it a correlatable identifier would let it join its
# records to another SP's.
sp_entity_id: https://analytics.campus.test/sp
display_name: Learning Analytics

subject_id_mode: pairwise

rules:
  # Students only. Staff activity in a learning-analytics dataset is employee
  # monitoring, which is a different conversation with a different committee.
  - id: analytics-students-only
    effect: allow-value
    attribute: urn:oid:1.3.6.1.4.1.5923.1.1.1.9
    value_filter: student@campus\.test
    precedence: 10

  # Explicit, though default-deny would withhold it anyway. Written down so the
  # answer to "why doesn't analytics get email?" is in the file rather than in
  # somebody's memory of a meeting.
  - id: analytics-no-mail
    effect: deny
    attribute: urn:oid:0.9.2342.19200300.100.1.3
    precedence: 5
