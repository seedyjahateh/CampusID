# The campus portal: the general-purpose front door.
#
# Tagged REFEDS R&S, so it receives that bundle without per-attribute rules.
# The two rules below are the exceptions to the bundle, not a restatement of it.
sp_entity_id: https://portal.campus.test/sp
display_name: Campus Portal

# The same application, reached by two protocols. Shibboleth knows it by the
# entityID above; an OIDC library knows it by its client_id. Both resolve to
# this one policy, so the app cannot end up seeing more over one protocol than
# the other - and because the subject identifier is derived from sp_entity_id
# rather than from whichever name was used, the same person is the same person
# on both paths.
aliases:
  - campus-portal

entity_categories:
  - http://refeds.org/category/research-and-scholarship

subject_id_mode: pairwise

# Operating under the FERPA school-official exception (34 CFR 99.31(a)(1)): a
# student who has opted out of the directory still has to be able to use the
# portal. Every release is still logged.
internal_school_official: true

rules:
  # Scoped affiliation drives most of the portal's own navigation.
  - id: portal-scoped-affiliation
    effect: allow
    attribute: urn:oid:1.3.6.1.4.1.5923.1.1.1.9

  # Entitlements are authorisation data, not profile data. The portal needs the
  # ones that name its own services and has no business with the rest - an HR
  # payroll entitlement in a student portal is a disclosure waiting to be
  # noticed by the wrong person.
  - id: portal-own-entitlements
    effect: allow-value
    attribute: urn:oid:1.3.6.1.4.1.5923.1.1.1.7
    value_filter: urn:mace:campus\.test:entitlement:portal:.+
    precedence: 20
