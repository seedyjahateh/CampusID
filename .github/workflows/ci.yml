name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .
      - name: mypy
        run: mypy

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      # tests/security runs here, not in the container job: the validation gate
      # is built against injectable stores precisely so the negative suite needs
      # no Postgres, no Redis and no IdP. If these ever start needing a
      # container, that is a design regression, not a CI problem.
      - name: pytest
        run: |
          pytest tests/unit tests/security \
            --cov=campusid \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            --junitxml=reports/unit.xml

      - name: Coverage gate for security-critical packages (PRD 12.1)
        run: |
          pytest tests/unit tests/security -q \
            --cov=campusid/saml \
            --cov-report=term-missing \
            --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            reports/
            coverage.xml
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # By hash, like the image. A scanner installed loosely is a scanner whose
      # verdict can change between two runs of the same commit, which is the one
      # property a merge gate cannot have.
      - name: Install the audit toolchain
        run: pip install --require-hashes -r requirements-dev.lock

      # Against the committed locks rather than the installed environment: a
      # cached runner holds whatever it held last time, which is not what the
      # next build will install.
      - name: Audit the locks (NFR-SEC-08)
        run: python scripts/audit_dependencies.py requirements.lock requirements-dev.lock

      # A lock that no longer matches its source is a lock that is not being
      # installed from. Regenerating and diffing is the only way to know, because
      # the failure is silent in both directions.
      - name: The locks match the requirements they came from
        run: |
          ./scripts/lock-dependencies.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock \
            || { echo "Lock files are stale. Run ./scripts/lock-dependencies.sh" >&2; exit 1; }

  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the runtime image
        run: docker build --target runtime -t campusid/broker:scan .

      # The other half of NFR-SEC-08. pip-audit reads the Python locks; this
      # reads the Debian packages underneath them, which the locks say nothing
      # about and which is where a base image goes stale.
      #
      # `ignore-unfixed` because an advisory with no released fix is not
      # actionable here except by changing base image, and a gate that is
      # permanently red is a gate somebody switches off. The pinned base image
      # being refreshed is what covers that class; this covers the rest.
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: campusid/broker:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    name: Compose smoke (acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Bring up the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build --wait --wait-timeout 300

      - name: Broker answers 200 on /healthz
        run: ./scripts/smoke.sh

      # The other half of NFR-SEC-09. tests/unit/test_container_hardening.py
      # reads the declarations and fails a pull request the moment one goes
      # missing; this reads the effective runtime configuration, which is the
      # only one an attacker meets. A compose file that says `read_only` and a
      # container that is writable are indistinguishable to the first.
      - name: The running broker is hardened (NFR-SEC-09)
        run: |
          set -euo pipefail
          compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          id=$($compose ps -q broker)
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true
          test "$(docker inspect -f '{{index .HostConfig.CapDrop 0}}' "$id")" = ALL
          test "$(docker inspect -f '{{len .HostConfig.CapAdd}}' "$id")" = 0
          docker inspect -f '{{range .HostConfig.SecurityOpt}}{{println .}}{{end}}' "$id" \
            | grep -qx 'no-new-privileges:true'
          # The process, not the image's declared user: an entrypoint that
          # escalated would still show `USER campusid` in the Dockerfile.
          test "$($compose exec -T broker id -u)" = 10001
          # Proven by attempting it. A root filesystem is read-only or it is not,
          # and the flag is a claim about that rather than the thing itself.
          if $compose exec -T broker sh -c 'touch /app/proof' 2>/dev/null; then
            echo "the root filesystem accepted a write" >&2
            exit 1
          fi

      # Everything that needs only the base stack. The `federation` and
      # `directory` markers are deselected because this job starts neither
      # Keycloak nor OpenLDAP — they have jobs of their own that do, which is the
      # whole reason the markers exist. Without this the suite runs tests whose
      # dependencies are absent and they fail on DNS, which reads as a broken
      # broker rather than as a missing service.
      - name: Integration tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm --build tests tests/integration -v \
            -m "not federation and not directory"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            down -v --remove-orphans

  directory:
    name: LDAP against a real directory
    runs-on: ubuntu-latest
    # Its own job rather than a step in the federation one: a change to the SAML
    # gate has no business waiting for a directory to start, and vice versa.
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Bring up the directory
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile directory up -d --build --wait --wait-timeout 300 \
            postgres redis broker openldap

      - name: Seed the tree
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile directory run --rm --build directory-init

      # FR-DIR-01 asks that plaintext be blocked in CI. Asserted against the
      # environment the tests actually run with, not against the file, because
      # the file is not what the containers read.
      - name: The plaintext escape hatch is not set for the broker
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T broker printenv CAMPUSID_LDAP_ALLOW_PLAINTEXT | grep -qx false

      - name: Directory tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm tests tests/integration -m directory -v

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile directory logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile directory down -v --remove-orphans

  federation:
    name: SSO against a real IdP
    runs-on: ubuntu-latest
    # Separate from compose-smoke so the fast job stays fast: Keycloak costs
    # ~40s of startup that most changes do not need.
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Bring up the broker
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile federation up -d --build --wait --wait-timeout 300 \
            postgres redis broker

      - name: Bring up Keycloak
        # No `--wait`: the Keycloak image is distroless, so it carries no shell
        # probe a compose healthcheck could use. federation-init polls for
        # readiness itself and fails loudly after 2 minutes.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile federation up -d keycloak

      - name: Exchange metadata
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile federation run --rm --build federation-init

      - name: Integration tests, including a real Keycloak login
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm tests tests/integration -v

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile federation logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile federation down -v --remove-orphans
