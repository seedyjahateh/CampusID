[project]
name = "campusid"
version = "0.1.0"
description = "SAML/OIDC identity broker with SCIM 2.0 provisioning and campus federation"
requires-python = ">=3.12"

# No build-system section: the application is run from source inside the
# container (WORKDIR /app on PYTHONPATH), not installed as a distribution.
# This file carries tool configuration only.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["campusid", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert: used deliberately in tests and internal invariants
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: hardcoded test credentials are fixtures.
# S320: the negative suite exists to feed hostile XML to the parser. Refusing to
#       let tests construct it would mean shipping the defenses untested.
"tests/**" = ["S105", "S106", "S320"]
"migrations/**" = ["E501"]          # generated revision identifiers

# flake8-bandit flags every lxml call as unsafe-XML (S320) and warns on
# etree usage generally. Blanket-suppressing that in a project whose whole
# point is XML security deserves an explanation, so here it is:
#
# campusid/saml/parser.py is the ONLY module permitted to parse untrusted
# XML. It does so with a parser built by hardened_parser(), which sets
# resolve_entities=False, no_network=True, huge_tree=False, load_dtd=False
# and remove_comments=True, then applies affirmative structural checks
# (DOCTYPE rejection, duplicate-ID rejection, #WithComments rejection).
# S320's advice is "use defusedxml" — defusedxml does not support the
# c14n and XPath operations XML-DSig verification requires, and it is
# itself in maintenance mode. The hardening is done by hand and tested
# by tests/security/test_xml_hardening.py instead.
"campusid/saml/parser.py" = ["S320"]

[tool.ruff.lint.isort]
known-first-party = ["campusid"]

[tool.mypy]
python_version = "3.12"
files = ["campusid", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fakeredis.*"]
ignore_missing_imports = true

# signxml is typed but re-exports its public names through __init__ without an
# __all__, which strict mode's no_implicit_reexport rejects. Importing from the
# private submodules instead would couple us to its internal layout.
[[tool.mypy.overrides]]
module = ["signxml.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The application runs from source rather than as an installed distribution,
# so the repo root has to be on sys.path for `import campusid` to resolve.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires live Postgres/Redis/LDAP/IdP containers",
    "e2e: requires a browser and the full compose stack",
    "security: negative test - asserts a specific rejection reason code",
]

[tool.coverage.run]
source = ["campusid"]
branch = true
omit = ["campusid/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
